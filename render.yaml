# Render: statische Webseite für Zahlenotter, mit automatischer Vorschau je Pull Request.
# Das Blueprint wird beim Verbinden des Repos in Render gelesen (Blueprints, «New Blueprint Instance»).
services:
  - type: web
    name: zahlenotter
    runtime: static
    repo: https://github.com/goerks/zahlenotter
    branch: main
    buildCommand: npm ci || npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # Für jeden Pull Request entsteht automatisch eine eigene Vorschau.
    previews:
      generation: automatic
    envVars:
      # Auf GitHub Pages liegt die App unter /zahlenotter/ (Standard in vite.config.ts).
      # Auf Render liegt sie an der Wurzel, deshalb hier /.
      - key: BASE
        value: /
      - key: NODE_VERSION
        value: "22"
